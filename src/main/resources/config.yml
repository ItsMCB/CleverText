# Webhook Integration (e.g., Discord; can also be configured via CLEVERTEXT_WEBHOOK_URL env var)
webhook:
  enabled: true
  url: ""
  username: "CleverText"
  avatar-url: ""
  # Only send webhook alerts for catches from rules/url-filter that have logging: true
  respect-rule-logging: true
  events:
    - FILTER_REPLACE
    - FILTER_BLOCK
    - CLEAR_CHAT
  # Optional surface filter (omit or leave empty to log all surfaces)
  surfaces:
    - CHAT
    - COMMAND
    - SIGN
    - BOOK
    - ANVIL
    - ENTITY_NAME