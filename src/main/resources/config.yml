# CleverText gives you full control over its features. Please read the comments (lines with # before them) to understand what each feature does and how to customize it.
file-version: 3 # DO NOT EDIT THIS

features:
  # /clearchat clears client chat history by sending empty lines
  clearchat:
    enabled: true
    permission: "clevertext.clearchat"
    empty-message-amount: 150
    announcement: "<aqua>Chat has been cleared by <dark_aqua><actor></dark_aqua></aqua>"

  # Main text handling & surface monitoring settings
  handler:
    enabled: true
    # Permission required to view detailed catch hover tooltips and alerts (clevertext.staff is also honored)
    staff-permission: "group.staff"
    # Permission that allows bypassing moderation filters (REPLACE, BLOCK, and non-whitelisted URL restrictions)
    bypass-permission: "clevertext.bypass"
    # Log detailed regex/URL catch diagnostics to console
    debug: false
    # Messages sent when input is blocked (supports MiniMessage)
    blocked-message: "<red>Your message was blocked by the text filter.</red>"
    blocked-surface-message: "<red>Your <surface> text was blocked by the text filter.</red>"
    # Notify the player when non-chat text (sign, book, anvil, command, name tag) is censored
    notify-on-censor: true
    censored-surface-message: "<yellow>Some words in your <surface> were censored by the filter.</yellow>"

    # Surfaces where CleverText applies text & URL processing
    surfaces:
      chat: true
      signs: true
      books: true
      anvils: true
      entity-naming: true
      commands:
        enabled: true
        # Command -> 0-based argument index where the message text begins (after the command label)
        # Example: "/msg Steve hello world" has args ["Steve", "hello", "world"], so start-arg 1 skips "Steve"
        monitored:
          msg: 1
          tell: 1
          w: 1
          whisper: 1
          pm: 1
          r: 0
          reply: 0
          me: 0
          say: 0
          "minecraft:msg": 1
          "minecraft:tell": 1
          "minecraft:w": 1
          "minecraft:me": 0
          "minecraft:say": 0

  # Dedicated URL Whitelist & Hyperlink Engine
  url-filter:
    enabled: true
    # Available modes:
    #   WHITELIST_REPLACE - Censor unlisted URLs and optionally hyperlink whitelisted ones
    #   WHITELIST_BLOCK   - Block messages/edits containing any URL not on the whitelist
    #   ALLOW_ALL         - Allow all URLs (hyperlink if hyperlink-allowed is true)
    #   DISABLED          - Disable URL filtering and automatic hyperlinking
    mode: WHITELIST_REPLACE
    # Replacement shown for unlisted URLs in WHITELIST_REPLACE mode
    replacement: "[link removed]"
    # Convert allowed URLs into clickable green links in chat and signed written books
    hyperlink-allowed: true
    # Also detect bare domains and IPv4 addresses without http(s):// (e.g. discord.gg/abc, play.example.com)
    match-bare-domains: true
    # Log unlisted URL catches to console
    logging: true
    # Fire CleverTextCatchEvent when an unlisted URL is caught under WHITELIST_* modes
    fire-event: true
    # Surfaces checked by URL filter (omit or leave empty to check all surfaces)
    surfaces:
      - CHAT
      - COMMAND
      - SIGN
      - BOOK
      - ANVIL
      - ENTITY_NAME
    # Host and optional path-prefix rules:
    #   "youtube.com"           -> allows youtube.com and *.youtube.com
    #   "discord.gg/86qJJHtDgT" -> allows only paths starting with /86qJJHtDgT on discord.gg
    whitelist:
      - "minecraft.net"
      - "minecraft.wiki"
      - "youtube.com"
      - "youtu.be"
      - "modrinth.com"
      - "github.com"
      - "discord.gg/86qJJHtDgT"
      - "libregalaxy.org"

