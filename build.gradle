plugins {
    id 'java'
}

group = 'me.itsmcb'
version = '2.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    // Updated PAPI repo to match your other build files
    maven { url 'https://repo.helpch.at/releases/' }
}

dependencies {
    // Updated Paper versioning (Year.Drop.Patch format)
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly files('/home/martin/Repos/VexelCore/bukkit/build/libs/VexelCore-Bukkit-1.0.1-SNAPSHOT.jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

// Add gradle project version to each version placeholder in resources
processResources {
    filter { String line -> line.replace('${version}', project.version.toString()) }
}